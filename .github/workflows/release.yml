name: Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run release:check
      - run: npm test
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run release:windows
      - uses: actions/upload-artifact@v4
        with:
          name: LoRA-Studio-windows-x64
          path: release/v*/*
          if-no-files-found: error
      - name: Create draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $folder = Join-Path release "v$version"
          $assets = @(Get-ChildItem -LiteralPath $folder -File | ForEach-Object FullName)
          gh release create "$env:GITHUB_REF_NAME" --verify-tag --draft --title "LoRA Studio v$version" --notes-file "$folder/RELEASE_NOTES.md" @assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
